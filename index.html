<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play the classic Indian card game Raja Mantri Chor Sipahi online!"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Raja Mantri Chor Sipahi</title>
  </head>
  <body>
    <div class="container">
      <div class="main" id="mainArea">
        <div class="card c1" id="left">
          <img src="images/Question.png" alt="?" />
          <h3 class="role"></h3>
          <div class="points-badge"></div>
        </div>
        <div class="card c2" id="right">
          <img src="images/Question.png" alt="?" />
          <h3 class="role"></h3>
          <div class="points-badge"></div>
        </div>
        <div class="card c3" id="up">
          <img src="images/Question.png" alt="?" />
          <h3 class="role"></h3>
          <div class="points-badge"></div>
        </div>
        <div class="card c4" id="down">
          <img src="images/Question.png" alt="?" />
          <h3 class="role"></h3>
          <div class="points-badge"></div>
        </div>

        <!-- Game announcement message -->
        <div id="gameMessage" class="game-message hidden">
          <div class="game-message-icon">📢</div>
          <p id="gameMessageText" class="game-message-text"></p>
          <div id="gameCountdown" class="game-countdown hidden">3</div>
        </div>

        <!-- Result message box -->
        <div id="resultBox" class="result-box hidden">
          <h2 id="resultTitle" class="result-title"></h2>
          <p id="resultVerdict" class="result-verdict"></p>
          <table id="resultTable" class="result-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Role</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
          <button id="nextRound" class="next-round-btn">Next Round ▶</button>
        </div>
      </div>

      <div class="aside">
        <h3 class="aside-title">Scoreboard</h3>
        <div class="aside-scroll">
          <table id="asideTable" class="asideTable">
            <thead>
              <tr>
                <th>R</th>
                <th>B1</th>
                <th>B2</th>
                <th>B3</th>
                <th>User</th>
              </tr>
            </thead>
            <tbody id="scoreBody"></tbody>
            <tfoot>
              <tr id="totalRow">
                <td><strong>T</strong></td>
                <td id="totalB1">0</td>
                <td id="totalB2">0</td>
                <td id="totalB3">0</td>
                <td id="totalU">0</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
